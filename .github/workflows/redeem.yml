name: Auto Redeem Codes

on:
    schedule:
        - cron: '0 */3 * * *'
    workflow_dispatch:
        inputs:
            auto:
                description: 'Auto Fetch Mode (-a)'
                required: true
                default: true
                type: boolean
            force:
                description: 'Force Redeem (-f)'
                required: true
                default: false
                type: boolean
            manual_args:
                description: 'Manual Codes (Opsional)'
                required: false
                type: string

jobs:
    redeem-codes:
        runs-on: ubuntu-latest
        concurrency:
            group: redeem-codes
            cancel-in-progress: false

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup uv
              uses: astral-sh/setup-uv@v7
              with:
                  version: "latest"
                  python-version: 3.13
                  enable-cache: true
                  activate-environment: true

            - name: Install dependencies
              run: |
                  uv sync

            - name: Run redeem script
              env:
                  HOYO_API_URL: "${{ secrets.HOYO_API_URL || vars.HOYO_API_URL || 'https://hoyo-api.haiueom.workers.dev' }}"
                  HOYO_API_KEY: ${{ secrets.HOYO_API_KEY }}
                  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
                  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
                  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
                  MAX_PARALLEL: ${{ vars.MAX_PARALLEL || '5' }}
                  LOCALE: ${{ vars.LOCALE || 'en-us' }}
                  LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
                  NO_GENSHIN: ${{ vars.NO_GENSHIN || 'False' }}
                  NO_STARRAIL: ${{ vars.NO_STARRAIL || 'False' }}
                  NO_ZZZ: ${{ vars.NO_ZZZ || 'False' }}
                  MANUAL_ARGS: ${{ inputs.manual_args }}
              run: |
                  ARGS=""
                  if [ "${{ github.event_name }}" == "schedule" ]; then
                    ARGS="-a"
                    echo "📅 Scheduled Run: Auto Mode"
                  else
                    if [ "${{ inputs.auto }}" == "true" ]; then ARGS="$ARGS -a"; fi
                    if [ "${{ inputs.force }}" == "true" ]; then ARGS="$ARGS -f"; fi
                    if [ -n "${MANUAL_ARGS}" ]; then ARGS="$ARGS ${MANUAL_ARGS}"; fi
                    echo "👤 Manual Run: Args = $ARGS"
                  fi

                  # shellcheck disable=SC2086
                  uv run main.py $ARGS
